[package]
name = "film-sim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Spectral analogue film simulation for RapidRAW, derived from spektrafilm-rs / spektrafilm"
publish = false

[lib]
name = "film_sim"
path = "src/lib.rs"

[features]
default = []
# Reference f64 precision for the CPU path (parity testing against spektrafilm).
precision-f64 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"
rand_mt = "5"
byteorder = "1"
thiserror = "2"
half = "2.7"
libm = "0.2"
rustfft = "6"
tracing = "0.1"
image = { version = "0.25", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
